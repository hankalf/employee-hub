<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Employee Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦺</text></svg>" />
  <link rel="stylesheet" href="/assets/hub.css" />
</head>
<body>
  <div class="glow spectrum" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" id="brand" href="/kiosk"><span class="pill spectrum" aria-hidden="true"></span><span class="brand-name">Employee Hub</span></a>
      <div id="top-clock" class="top-clock" role="timer" aria-live="off" hidden></div>
      <div class="topbar-right">
        <div id="lang-toggle" class="lang-toggle" role="group" hidden></div>
        <a id="mini-qr" class="mini-qr" href="/qr" hidden><img src="/qr.svg" alt="" /><span id="mini-qr-label"></span></a>
      </div>
    </div>
  </header>
  <main>
    <section class="hero" id="hero">
      <div class="greeting" id="greeting-block">
        <p id="hero-name" class="hero-name" hidden></p>
        <p id="date" class="date">&nbsp;</p>
        <h1 id="greeting">&nbsp;</h1>
        <p id="intro" class="intro"></p>
      </div>
      <div id="notes" class="notes" hidden></div>
    </section>
    <div id="tiles" aria-label="Tools"></div>
    <div id="intro-bottom-slot" class="intro-bottom-slot"></div>
  </main>
  <footer class="kiosk-foot"><a href="/admin" id="admin-link">Admin</a></footer>

  <dialog id="pin-dialog" class="pin-dialog">
    <form method="dialog">
      <h2 id="pin-title"></h2>
      <p id="pin-sub" class="muted small"></p>
      <div id="pin-dots" class="pin-dots" aria-live="polite"></div>
      <div class="keypad" id="keypad"></div>
      <p id="pin-error" class="alert" hidden></p>
      <button type="button" class="cancel" id="pin-cancel"></button>
    </form>
  </dialog>

  <div id="saver" class="saver" hidden>
    <div class="saver-inner">
      <div id="saver-brand" class="saver-brand"></div>
      <div id="saver-clock" class="saver-clock"></div>
      <p id="saver-date" class="saver-date"></p>
      <div id="saver-notes" class="saver-notes"></div>
      <div id="saver-qr" class="saver-qr frost"><img src="/qr.svg" alt="" /><span id="saver-qr-label"></span></div>
      <p id="saver-hint" class="saver-hint"></p>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script src="/assets/home.js"></script>
</body>
</html>
