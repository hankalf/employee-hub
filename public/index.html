<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Employee Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦺</text></svg>" />
  <link rel="stylesheet" href="/assets/hub.css" />
</head>
<body>
  <div class="glow spectrum" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" id="brand" href="/kiosk"><span class="pill spectrum" aria-hidden="true"></span><span class="brand-name">Employee Hub</span></a>
      <div class="topbar-right">
        <div id="lang-toggle" class="lang-toggle" role="group" hidden></div>
        <a id="mini-qr" class="mini-qr" href="/qr" hidden><img src="/qr.svg" alt="" /><span id="mini-qr-label"></span></a>
      </div>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="greeting">
        <p id="date" class="date">&nbsp;</p>
        <h1 id="greeting">&nbsp;</h1>
        <p id="intro" class="intro"></p>
      </div>
      <aside id="note" class="note frost" hidden>
        <span id="note-icon" class="note-icon" aria-hidden="true"></span>
        <div><strong id="note-title"></strong><p id="note-body"></p></div>
      </aside>
    </section>
    <section id="tiles" class="tiles" aria-label="Tools"></section>
  </main>
  <footer class="kiosk-foot"><a href="/admin" id="admin-link">Admin</a></footer>
  <script src="/assets/common.js"></script>
  <script src="/assets/home.js"></script>
</body>
</html>
