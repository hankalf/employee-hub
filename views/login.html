<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Admin sign in · Employee Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦺</text></svg>" />
  <link rel="stylesheet" href="/assets/hub.css" />
  <link rel="stylesheet" href="/assets/admin.css" />
</head>
<body class="login-page">
  <div class="glow spectrum" aria-hidden="true"></div>
  <main class="login-card frost">
    <div class="login-brand"><span id="login-logo" class="pill spectrum" aria-hidden="true"></span><div><h1 id="login-title">Employee Hub admin</h1><p class="muted small">Set up the tiles, note, logo and look of the kiosk.</p></div></div>
    <p id="notice" class="notice" hidden></p>
    <p id="error" class="alert-box" hidden></p>
    <form method="post" action="/admin/login">
      <label>Username
        <input type="text" name="username" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin" />
      </label>
      <label>Password
        <input type="password" name="password" id="password" autocomplete="current-password" required />
      </label>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/assets/login.js"></script>
</body>
</html>
